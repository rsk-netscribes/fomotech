<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0C0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FomoTech prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
/* FomoTech prototype. Tokens and components follow the FomoTech design system (tokens.json, bundle.css). */
:root{
  --font-serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-sans:Inter,-apple-system,system-ui,"Segoe UI",sans-serif;
  --radius-sm:6px;--radius-md:8px;--radius-lg:12px;--radius-xl:24px;--radius-sheet:28px;--radius-full:9999px;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--space-11:44px;
  --ease:cubic-bezier(.22,.8,.24,1);
}
html.dark{
  --bg:#0B0C0F;--surface:#17191E;--surface-elevated:#20232B;--surface-pressed:#262A34;
  --ink:#F2F3F5;--ink-secondary:#A1A6B0;--ink-muted:#8A91A0;
  --accent:#7E9CFF;--on-accent:#0B1B4D;--accent-soft:#7E9CFF26;--new-dot:#FF6A45;
  --hairline:#FFFFFF24;--hairline-strong:#FFFFFF2E;--glass:#17191EB8;--glass-rim:#FFFFFF2E;--scrim:#00000099;
  --shadow-card:0 2px 8px #00000033;--shadow-glass:0 8px 32px #0000005c,0 1px 2px #00000033;
  --page:#050608;--page-ink:#A1A6B0;color-scheme:dark;
}
html.light{
  --bg:#F4F5F7;--surface:#FFFFFF;--surface-elevated:#EBEDF2;--surface-pressed:#E2E5EC;
  --ink:#15171C;--ink-secondary:#5D636E;--ink-muted:#656E7F;
  --accent:#2450E6;--on-accent:#FFFFFF;--accent-soft:#2450E614;--new-dot:#F0461E;
  --hairline:#15171C1F;--hairline-strong:#15171C29;--glass:#FFFFFFC7;--glass-rim:#00000014;--scrim:#15171C66;
  --shadow-card:0 2px 10px #0000000a;--shadow-glass:0 8px 28px #00000014,0 1px 3px #0000000a;
  --page:#DADDE4;--page-ink:#5D636E;color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;color:inherit}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:14px;height:14px}.i.lg{width:24px;height:24px}
.i.fill{fill:currentColor}
.num{font-variant-numeric:tabular-nums}

/* ---------- Page shell (desktop) ---------- */
.shell{height:100dvh;display:flex;align-items:center;justify-content:center;gap:56px;height:100%;padding:20px}
.side{width:300px;max-height:calc(100% - 20px);overflow:auto;color:var(--page-ink);display:flex;flex-direction:column;gap:18px;font-size:13px;line-height:19px;scrollbar-width:thin}
.side h1{margin:0;font:700 22px/28px var(--font-serif);color:var(--ink);letter-spacing:-.015em}
.side h1 i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--new-dot);margin-left:5px;vertical-align:6px}
.side p{margin:0}
.side h2{margin:0 0 8px;font:600 11px/14px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump button,.side .opt button{height:30px;padding:0 11px;border-radius:9999px;border:0;background:var(--surface);color:var(--ink);font:500 12px/1 var(--font-sans);cursor:pointer;box-shadow:inset 0 0 0 1px var(--hairline-strong)}
.jump button:hover{background:var(--surface-pressed)}
.side .opt{display:flex;gap:6px;flex-wrap:wrap}
.side .opt button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);box-shadow:none;font-weight:600}
.side .note{font-size:12px;line-height:17px;color:var(--ink-muted)}
.stagewrap{flex:none;position:relative}
.device{position:relative;width:390px;height:844px;transform-origin:top left}
.device__bezel{position:absolute;inset:-11px;border-radius:63px;background:#0a0a0c;box-shadow:0 0 0 1.5px #3a3d46 inset,0 30px 80px #0008,0 0 0 1px #00000040}
.phone{position:absolute;inset:0;border-radius:52px;overflow:hidden;background:var(--bg);isolation:isolate;
  --safe-top:56px;--safe-bot:30px}
.island{position:absolute;top:11px;left:50%;width:118px;height:34px;margin-left:-59px;border-radius:20px;background:#000;z-index:100;pointer-events:none}
.statusbar{position:absolute;top:0;left:0;right:0;height:56px;z-index:90;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 40px;font:600 16px/1 var(--font-sans);pointer-events:none;color:var(--ink)}
.statusbar svg{height:12px;fill:currentColor}
.homebar{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);opacity:.9;z-index:100;pointer-events:none}

@media (max-width:1000px){.side{display:none}}
@media (max-width:520px),(pointer:coarse) and (max-width:900px){
  .shell{padding:0;gap:0}.side{display:none}.stagewrap{width:100%!important;height:100%!important}
  .device{width:100%!important;height:100%!important;transform:none!important}
  .device__bezel,.island,.statusbar,.homebar{display:none}
  .phone{border-radius:0;--safe-top:max(env(safe-area-inset-top),14px);--safe-bot:env(safe-area-inset-bottom,0px)}
}

/* ---------- Screens ---------- */
[hidden]{display:none!important}
.statusfade{position:absolute;top:0;left:0;right:0;height:calc(var(--safe-top) + 22px);z-index:25;pointer-events:none;background:linear-gradient(var(--bg) 45%,transparent)}
#base{position:absolute;inset:0;transition:transform .36s var(--ease),filter .36s}
#base>.layer[hidden]{display:none}
.phone{user-select:none;-webkit-user-select:none}
.phone[data-mini="1"] .pad{padding-bottom:calc(max(12px,var(--safe-bot) - 8px) + 60px + 92px)}
.pad.t0{padding-top:calc(var(--safe-top) + 14px)}
.feed.anim .card,.feed.anim .minirow{animation:rise .5s var(--ease) both;animation-delay:calc(var(--n)*55ms)}
.layer{position:absolute;inset:0;background:var(--bg);overflow:hidden}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:calc(var(--safe-top) + 64px) 16px calc(max(12px,var(--safe-bot) - 8px) + 60px + 28px)}
.push{transition:transform .36s var(--ease);will-change:transform}
.push.in{animation:slidein .36s var(--ease) both}
.push.out{transform:translateX(100%)}
@keyframes slidein{from{transform:translateX(100%)}to{transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes up-in{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes up-out{from{transform:none;opacity:1}to{transform:translateY(-40px);opacity:0}}
.under{transform:translateX(-22%);filter:brightness(.7);transition:transform .36s var(--ease),filter .36s}
.fade{animation:fadein .3s var(--ease) both}
.rise{animation:rise .5s var(--ease) both}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:9999px;font:600 15px/1 var(--font-sans);border:0;cursor:pointer;color:var(--ink);background:none;transition:transform .12s,background .2s,opacity .2s}
.btn:active{transform:scale(.975)}
.btn--primary{background:var(--accent);color:var(--on-accent)}
.btn--secondary{background:var(--surface);box-shadow:inset 0 0 0 1px var(--hairline-strong)}
.btn--apple{background:var(--ink);color:var(--bg)}
.btn--text{color:var(--accent);min-height:44px;padding:0 8px}
.btn--danger{color:#FF6A45}
.btn--block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-secondary);background:none;border:0;cursor:pointer;border-radius:9999px;flex:none;transition:color .2s,transform .12s}
.iconbtn:active{transform:scale(.9)}
.iconbtn[aria-pressed=true]{color:var(--accent)}
.iconbtn[aria-pressed=true] .i{fill:currentColor}
.label{font:600 11px/14px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-secondary)}
.meta{font:500 11px/14px var(--font-sans);letter-spacing:.02em;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.dot{width:6px;height:6px;border-radius:9999px;background:var(--new-dot);display:inline-block;flex:none}
.ai{font:500 11px/14px var(--font-sans);color:var(--ink-muted);background:var(--surface-elevated);border-radius:var(--radius-sm);padding:2px 8px;white-space:nowrap}

/* Glass */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--glass-rim),var(--shadow-glass)}
.topbar{position:absolute;top:calc(var(--safe-top) - 6px);left:16px;right:16px;height:48px;border-radius:var(--radius-xl);display:flex;align-items:center;gap:6px;padding:0 6px;z-index:30;color:var(--ink)}
.pills{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;touch-action:pan-x;padding:0 2px;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.pills::-webkit-scrollbar{display:none}
.pill{height:34px;padding:0 13px;border-radius:9999px;display:inline-flex;align-items:center;gap:6px;font:500 12.5px/1 var(--font-sans);color:var(--ink-secondary);white-space:nowrap;background:none;border:0;cursor:pointer;flex:none;transition:background .2s,color .2s}
.pill .meta{color:inherit;opacity:.7}
.pill[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tabbar{position:absolute;left:16px;right:16px;bottom:max(12px,calc(var(--safe-bot) - 8px));height:60px;border-radius:var(--radius-xl);display:flex;align-items:center;justify-content:space-around;padding:0 6px;z-index:30}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-muted);font:600 10px/12px var(--font-sans);background:none;border:0;border-radius:9999px;cursor:pointer;flex:1;height:50px;transition:color .2s,background .25s}
.tab[aria-current=page]{color:var(--accent);background:var(--accent-soft)}
.tab:active{transform:scale(.95)}
.player{position:absolute;left:16px;right:16px;bottom:calc(max(12px,calc(var(--safe-bot) - 8px)) + 68px);height:52px;border-radius:9999px;display:flex;align-items:center;gap:4px;padding:0 4px 0 6px;overflow:hidden;z-index:29;color:var(--ink);cursor:pointer}
.player.enter{animation:up-in .4s var(--ease) both}
.player__eq{width:36px;height:36px;display:flex;align-items:center;justify-content:center;gap:2px;color:var(--accent)}
.player__eq i{width:2.5px;border-radius:2px;background:currentColor;height:6px}
.playing .player__eq i{animation:eq 0.9s ease-in-out infinite}
.player__eq i:nth-child(2){animation-delay:-.3s}.player__eq i:nth-child(3){animation-delay:-.6s}.player__eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{0%,100%{height:5px}50%{height:16px}}
.player__txt{flex:1;min-width:0;padding-left:2px}
.player__txt b{display:block;font:600 12.5px/16px var(--font-sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player__bar{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);transition:width .25s linear}
.toast{position:absolute;left:24px;right:24px;bottom:calc(max(12px,calc(var(--safe-bot) - 8px)) + 76px);z-index:80;border-radius:9999px;min-height:46px;padding:6px 8px 6px 18px;display:flex;align-items:center;gap:8px;font:500 13px/18px var(--font-sans);animation:up-in .35s var(--ease) both}
.toast.mini-up{bottom:calc(max(12px,calc(var(--safe-bot) - 8px)) + 132px)}
.toast span{flex:1}
.toast.out{animation:up-out .3s var(--ease) both}

/* ---------- Welcome ---------- */
.welcome{display:flex;flex-direction:column;padding:calc(var(--safe-top) + 24px) 24px calc(var(--safe-bot) + 20px);height:100%;position:relative}
.welcome::before{content:"";position:absolute;inset:-10% -20% auto;height:60%;background:radial-gradient(closest-side,var(--accent-soft),transparent);pointer-events:none}
.brandmark{font:700 24px/1 var(--font-serif);letter-spacing:-.01em;text-align:center;position:relative}
.brandmark i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--new-dot);margin-left:4px;vertical-align:10px}
.by{text-align:center;margin-top:8px}
.display{font:700 30px/36px var(--font-serif);letter-spacing:-.02em;margin:0}
.welcome .display{margin-top:34px}
.lede{font:400 16px/24px var(--font-sans);color:var(--ink-secondary);margin:12px 0 0;letter-spacing:-.01em}
.freecard{background:var(--surface);border-radius:var(--radius-lg);padding:16px;margin-top:24px;box-shadow:var(--shadow-card);position:relative}
.freecard b.hd{display:flex;align-items:center;gap:10px;font:600 15px/20px var(--font-sans);color:var(--ink);padding-bottom:12px;border-bottom:1px solid var(--hairline)}
.freecard b.hd .i{color:var(--accent)}
.freecard ul{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.freecard li{display:flex;gap:10px;font:400 13.5px/19px var(--font-sans);color:var(--ink-secondary)}
.freecard li .i{color:var(--accent);width:16px;height:16px;margin-top:2px}
.freecard li strong{color:var(--ink);font-weight:600}
.cta{margin-top:auto;display:flex;flex-direction:column;gap:10px;position:relative}
.or{display:flex;align-items:center;gap:12px;color:var(--ink-muted);font:500 11px/1 var(--font-sans);letter-spacing:.06em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--hairline)}
.legal{text-align:center;font:400 12px/17px var(--font-sans);color:var(--ink-muted);margin-top:4px}
.legal u{color:var(--accent);text-decoration:none}
.btn .brand{width:18px;height:18px;flex:none}

/* ---------- Themes (bubbles) ---------- */
.setup{display:flex;flex-direction:column;height:100%}
.setup__top{padding:calc(var(--safe-top) + 4px) 20px 0;display:flex;align-items:center;justify-content:space-between;min-height:calc(var(--safe-top) + 48px)}
.stepcap{font:600 11px/14px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);display:flex;align-items:center;gap:6px}
.count{font:600 12px/1 var(--font-sans);color:var(--accent);background:var(--accent-soft);padding:7px 12px;border-radius:9999px;transition:transform .2s}
.count.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.setup__body{flex:1;overflow-y:auto;scrollbar-width:none;padding:8px 16px 130px;touch-action:pan-y}
.setup__body::-webkit-scrollbar{display:none}
.setup h2{margin:0;font:700 28px/34px var(--font-serif);letter-spacing:-.02em;padding:0 4px}
.setup .sub{font:400 14px/20px var(--font-sans);color:var(--ink-secondary);margin:6px 4px 0}
.bubbles{position:relative;height:420px;margin:6px auto 0;width:358px}
.bubble{position:absolute;border:0;background:none;padding:0;cursor:pointer;transform:translate(-50%,-50%);animation:bpop .6s var(--ease) both}
@keyframes bpop{from{opacity:0;scale:.6}to{opacity:1;scale:1}}
.bubble__in{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font:600 13px/17px var(--font-sans);letter-spacing:-.005em;color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--hairline-strong),var(--shadow-card);transition:transform .35s cubic-bezier(.3,1.6,.5,1),background .25s,color .25s,box-shadow .25s;animation:float var(--d,7s) ease-in-out infinite;position:relative;flex-direction:column;gap:4px}
@keyframes float{0%,100%{translate:0 0}50%{translate:var(--fx,3px) var(--fy,-6px)}}
.bubble[aria-pressed=true] .bubble__in{background:var(--accent);color:var(--on-accent);box-shadow:none;transform:scale(1.07)}
.bubble:active .bubble__in{transform:scale(.94)}
.bubble .tick{position:absolute;top:9%;right:9%;width:22px;height:22px;border-radius:50%;background:var(--on-accent);color:var(--accent);display:flex;align-items:center;justify-content:center;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.bubble .tick .i{width:13px;height:13px;stroke-width:2.2}
.bubble[aria-pressed=true] .tick{transform:scale(1)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:9999px;background:var(--surface-elevated);color:var(--ink-secondary);font:500 13px/1 var(--font-sans);border:0;cursor:pointer;transition:background .2s,color .2s,transform .12s}
.chip:active{transform:scale(.96)}
.chip .i{width:14px;height:14px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.setup__foot{position:absolute;left:0;right:0;bottom:0;padding:40px 16px calc(var(--safe-bot) + 14px);background:linear-gradient(transparent,var(--bg) 38%);z-index:5}
.fine{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:var(--radius-lg);padding:12px 14px;margin-top:18px;font:400 12.5px/18px var(--font-sans);color:var(--ink-secondary)}
.fine .i{color:var(--ink-muted);margin-top:1px}

.prep{display:flex;flex-direction:column;justify-content:center;height:100%;padding:0 32px}
.prep ul{list-style:none;padding:0;margin:28px 0 0;display:flex;flex-direction:column;gap:14px}
.prep li{display:flex;align-items:center;gap:12px;font:500 14px/20px var(--font-sans);color:var(--ink-secondary);opacity:.35;transition:opacity .4s}
.prep li.on{opacity:1;color:var(--ink)}
.prep li .ring{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--hairline-strong);display:flex;align-items:center;justify-content:center;flex:none;color:var(--on-accent);transition:all .3s}
.prep li.on .ring{background:var(--accent);border-color:var(--accent)}
.prep li .ring .i{width:12px;height:12px;stroke-width:2.4;opacity:0}
.prep li.on .ring .i{opacity:1}

/* ---------- Today ---------- */
.greet{margin:0;font:700 30px/36px var(--font-serif);letter-spacing:-.02em}
.dateline{font:400 14px/20px var(--font-sans);color:var(--ink-secondary);margin-top:4px}
.progress{display:flex;align-items:center;gap:12px;margin-top:14px}
.progress__track{flex:1;height:3px;border-radius:9999px;background:var(--hairline-strong);overflow:hidden}
.progress__fill{height:100%;background:var(--accent);border-radius:9999px;transition:width .5s var(--ease)}
.listenrow{display:flex;gap:8px;margin:14px 0 18px}
.listenbtn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px 0 12px;border-radius:9999px;background:var(--accent-soft);color:var(--accent);border:0;font:600 13px/1 var(--font-sans);cursor:pointer}
.listenbtn .meta{color:inherit;opacity:.75}
.feed{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;border:0;width:100%;color:var(--ink);transition:background .15s,transform .15s;position:relative}
.card:active{background:var(--surface-pressed);transform:scale(.99)}
.card__top{display:flex;align-items:center;gap:8px}
.card__idx{font:700 15px/1 var(--font-serif);color:var(--accent);font-variant-numeric:tabular-nums;min-width:16px}
.card__tags{font:600 11px/14px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-secondary);flex:1;min-width:0}
.card__new .meta{text-transform:none}
.card__new{display:flex;align-items:center;gap:6px;font:600 11px/14px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-secondary)}
.card h3{margin:0;font:600 18px/24px var(--font-serif);letter-spacing:-.01em;color:var(--ink)}
.card p{margin:0;font:400 13px/18px var(--font-sans);color:var(--ink-secondary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card__foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--hairline);padding-top:10px;margin-bottom:-6px}
.card__foot .meta{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card__foot .iconbtn{margin:-6px -8px -6px 0;width:40px;height:40px}
.card--read h3{color:var(--ink-secondary)}
.photo{height:128px;border-radius:var(--radius-md);overflow:hidden;position:relative;background:linear-gradient(135deg,#0E1634,#96B4FF);filter:saturate(.7)}
.photo svg{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:soft-light;opacity:.8}
.photo .live{position:absolute;left:10px;bottom:10px}
.end{margin:6px 0 0;text-align:center;font:500 13px/18px var(--font-sans);color:var(--ink-muted);padding:18px 0}
.endbtn{margin-top:6px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:48px 24px;color:var(--ink-secondary)}
.empty .ring{width:56px;height:56px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--accent);box-shadow:inset 0 0 0 1px var(--hairline-strong)}
.empty h4{margin:6px 0 0;font:600 18px/24px var(--font-serif);color:var(--ink)}
.empty p{margin:0;font:400 14px/20px var(--font-sans);max-width:260px}

/* ---------- Story ---------- */
.s-top{position:absolute;top:calc(var(--safe-top) - 6px);left:16px;right:16px;height:48px;border-radius:var(--radius-xl);display:flex;align-items:center;gap:4px;padding:0 6px;z-index:30}
.s-top .where{flex:1;display:flex;align-items:center;gap:8px;justify-content:center;font:600 12px/1 var(--font-sans);letter-spacing:.04em;color:var(--ink-secondary)}
.s-top .where b{color:var(--accent);font-weight:700}
.listenpill{height:36px;display:inline-flex;align-items:center;gap:6px;padding:0 12px 0 10px;border-radius:9999px;border:0;background:var(--accent-soft);color:var(--accent);font:600 12px/1 var(--font-sans);cursor:pointer;margin-right:4px}
.listenpill .player__eq{width:16px;height:16px;gap:1.5px}
.listenpill .player__eq i{width:2px}
.s-bot{position:absolute;left:16px;right:16px;bottom:max(12px,calc(var(--safe-bot) - 8px));height:60px;border-radius:var(--radius-xl);display:flex;align-items:center;gap:2px;padding:0 8px 0 6px;z-index:30}
.s-bot .act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:56px;height:50px;border:0;background:none;color:var(--ink-secondary);font:600 10px/12px var(--font-sans);cursor:pointer;border-radius:16px}
.s-bot .act[aria-pressed=true]{color:var(--accent)}
.s-bot .act[aria-pressed=true] .i{fill:currentColor}
.s-bot .act:active{transform:scale(.92)}
.s-bot .btn{margin-left:auto;min-height:44px;padding:0 18px}
.story{animation:var(--anim,none)}
.story .tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.story h1{margin:12px 0 0;font:700 25px/31px var(--font-serif);letter-spacing:-.015em}
.byline{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-top:12px}
.summary{font:400 16px/25px var(--font-sans);letter-spacing:-.01em;margin:16px 0 0;color:var(--ink)}
.why{background:var(--surface);border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;gap:8px;margin-top:20px;position:relative;overflow:hidden}
.why::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.why .label{color:var(--accent);display:flex;align-items:center;gap:6px}
.why p{margin:0;font:400 14.5px/21px var(--font-sans);color:var(--ink)}
.why.flash{animation:flash 1.1s ease}
@keyframes flash{0%,100%{background:var(--surface)}30%{background:var(--accent-soft)}}
.sec{margin-top:24px}
.sec>.label{display:flex;justify-content:space-between;margin-bottom:10px}
.tools{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;margin:0 -16px;padding:0 16px}
.tools::-webkit-scrollbar{display:none}
.tool{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:9999px;border:.5px solid var(--hairline-strong);background:none;color:var(--ink);font:500 12.5px/1 var(--font-sans);white-space:nowrap;cursor:pointer;flex:none;transition:background .2s,color .2s,border-color .2s,transform .12s}
.tool:active{transform:scale(.95)}
.tool .i{width:14px;height:14px}
.tool[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sources{background:var(--surface);border-radius:var(--radius-lg);padding:0 16px;overflow:hidden}
.source{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border:0;border-bottom:1px solid var(--hairline);background:none;width:100%;text-align:left;cursor:pointer;color:inherit;font-family:inherit}
.source:last-child{border-bottom:0}
.source:active{opacity:.6}
.source b{font:600 14px/20px var(--font-sans);color:var(--ink)}
.source b i{font:600 10px/14px var(--font-sans);font-style:normal;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-left:8px}
.source span{grid-column:1/-1;font:400 13px/18px var(--font-sans);color:var(--ink-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.source .meta{grid-column:2;grid-row:1}
.upnext{margin-top:24px;background:var(--surface);border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;border:0;text-align:left;width:100%;color:inherit}
.upnext h4{margin:0;font:600 16px/22px var(--font-serif)}
.upnext .hint{display:flex;align-items:center;gap:6px;font:500 12px/16px var(--font-sans);color:var(--accent)}
.upnext .hint .i{width:14px;height:14px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-3px)}}
.footnote{margin:22px 0 0;text-align:center;font:400 11.5px/16px var(--font-sans);color:var(--ink-muted)}

/* Reader */
.rd-bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--hairline-strong);border-radius:2px;overflow:hidden}
.rd-bar i{display:block;height:100%;width:0;background:var(--accent)}
.reader{padding:calc(var(--safe-top) + 72px) 22px 80px}
.reader .kick{display:flex;align-items:center;gap:8px}
.reader h1{font:700 26px/32px var(--font-serif);letter-spacing:-.015em;margin:12px 0 0}
.reader .by2{font:500 12.5px/18px var(--font-sans);color:var(--ink-secondary);margin:12px 0 22px;padding-bottom:16px;border-bottom:1px solid var(--hairline)}
.reader{user-select:text;-webkit-user-select:text}
.reader p{font:400 17px/28px var(--font-serif);margin:0 0 18px;color:var(--ink);user-select:text;-webkit-user-select:text}
.reader .callout{background:var(--surface);border-radius:var(--radius-lg);padding:14px 16px;font:400 13px/19px var(--font-sans);color:var(--ink-secondary);margin-bottom:22px;display:flex;gap:10px}
.reader .callout .i{color:var(--accent);margin-top:1px}

/* Sheets */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:60;animation:fadein .3s both}
.scrim.out{opacity:0;transition:opacity .28s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;padding:8px 20px calc(var(--safe-bot) + 16px);display:flex;flex-direction:column;gap:14px;color:var(--ink);max-height:90%;animation:sheetin .42s var(--ease) both;touch-action:none}
.sheet.tall{height:min(92%,780px)}
.sheet.out{transform:translateY(105%);transition:transform .3s var(--ease)}
@keyframes sheetin{from{transform:translateY(100%)}to{transform:none}}
.sheet .handle{width:36px;height:5px;border-radius:9999px;background:var(--hairline-strong);align-self:center;flex:none;margin:2px 0 4px}
.sheet__head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sheet__head h4{margin:0;font:600 20px/26px var(--font-serif);letter-spacing:-.01em}
.sheet__head .label{margin-top:2px;display:block}
.sheet__body{overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:14px;touch-action:pan-y;flex:1;min-height:0}
.sheet__body::-webkit-scrollbar{display:none}
.sheet p{margin:0;font:400 14.5px/21px var(--font-sans)}
.close{width:32px;height:32px;border-radius:50%;background:var(--surface-elevated);border:0;color:var(--ink-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.module{background:var(--surface-elevated);border-radius:var(--radius-lg);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.module .label{display:flex;align-items:center;gap:6px}
.sheet p.verdict,.verdict{font:600 20px/26px var(--font-serif);letter-spacing:-.01em}
.ev{display:flex;gap:12px;align-items:flex-start}
.ev .mk{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--surface-elevated);color:var(--ink-secondary);box-shadow:inset 0 0 0 1px var(--hairline-strong)}
.ev .mk.ok{background:var(--accent);color:var(--on-accent);box-shadow:none}
.ev .mk .i{width:14px;height:14px;stroke-width:2}
.ev b{display:block;font:600 11px/14px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-secondary);margin-bottom:2px}
.ev p{font-size:14px;line-height:20px}
.bias{display:flex;flex-direction:column;gap:10px}
.bias__bar{display:flex;height:10px;border-radius:9999px;overflow:hidden;gap:2px}
.bias__bar i{display:block;height:100%;transition:flex .6s var(--ease)}
.bias__for{background:var(--accent)}.bias__mixed{background:var(--hairline-strong)}.bias__against{background:var(--ink)}
.bias__legend{display:flex;justify-content:space-between;font:500 12.5px/16px var(--font-sans);color:var(--ink-secondary);font-variant-numeric:tabular-nums}
.bias__legend span{display:flex;align-items:center;gap:6px}
.bias__legend em{width:8px;height:8px;border-radius:50%;display:inline-block}
.seg{display:flex;background:var(--surface-elevated);border-radius:9999px;padding:3px;gap:2px;flex:none}
.seg button{flex:1;height:34px;border-radius:9999px;border:0;background:none;color:var(--ink-secondary);font:600 12px/1 var(--font-sans);cursor:pointer;transition:background .2s,color .2s;padding:0 6px;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--accent);box-shadow:inset 0 0 0 .5px var(--glass-rim),0 1px 3px #0003}
.points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:p}
.points li{display:flex;gap:12px;font:400 14.5px/21px var(--font-sans);counter-increment:p}
.points li::before{content:counter(p);font:700 15px/21px var(--font-serif);color:var(--accent);width:14px;flex:none}
.sheetfoot{display:flex;gap:8px;align-items:center;justify-content:space-between}
.note{font:400 12px/17px var(--font-sans);color:var(--ink-muted)}

/* Share card */
.sharecard{background:linear-gradient(160deg,#0E1634,#1b2a63 70%,#2f4aa8);border-radius:20px;padding:22px 22px 18px;color:#F2F3F5;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px #0004;position:relative;overflow:hidden}
.sharecard .brand{display:flex;justify-content:space-between;align-items:center;font:700 16px/1 var(--font-serif)}
.sharecard .brand i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#FF6A45;margin-left:3px;vertical-align:7px}
.sharecard .stag{font:600 10.5px/14px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:#96B4FF}
.sharecard h5{margin:0;font:700 22px/28px var(--font-serif);letter-spacing:-.015em}
.sharecard .why2{font:400 13.5px/20px var(--font-sans);color:#d5dcf5;border-left:2px solid #96B4FF;padding-left:12px}
.sharecard .ft{display:flex;justify-content:space-between;font:500 11px/14px var(--font-sans);color:#aab6e0;padding-top:12px;border-top:1px solid #ffffff2a}
.targets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.target{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;color:var(--ink);font:500 11.5px/14px var(--font-sans);padding:4px 0}
.target span.ic{width:52px;height:52px;border-radius:50%;background:var(--surface-elevated);display:flex;align-items:center;justify-content:center;color:var(--ink);transition:transform .12s}
.target:active span.ic{transform:scale(.9)}
.linkrow{display:flex;align-items:center;gap:10px;background:var(--surface-elevated);border-radius:var(--radius-lg);padding:6px 6px 6px 14px;font:500 13px/18px var(--font-sans);color:var(--ink-secondary)}
.linkrow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkrow .btn{min-height:38px;padding:0 16px;font-size:13px}

/* Full player */
.pl-wave{display:flex;align-items:center;gap:3px;height:64px;cursor:pointer;touch-action:none}
.pl-wave i{flex:1;border-radius:2px;background:var(--hairline-strong);min-height:4px;transition:background .15s}
.pl-wave i.on{background:var(--accent)}
.pl-time{display:flex;justify-content:space-between;font:500 12px/16px var(--font-sans);color:var(--ink-muted);font-variant-numeric:tabular-nums}
.pl-ctrl{display:flex;align-items:center;justify-content:space-between}
.bigplay{width:68px;height:68px;border-radius:50%;background:var(--accent);color:var(--on-accent);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s}
.bigplay:active{transform:scale(.93)}
.bigplay .i{width:28px;height:28px;fill:currentColor;stroke:none}
.speed{min-width:58px;height:36px;border-radius:9999px;border:0;background:var(--surface-elevated);font:600 13px/1 var(--font-sans);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.switch{display:flex;align-items:center;gap:10px;font:500 13px/1 var(--font-sans);color:var(--ink-secondary);background:none;border:0;cursor:pointer}
.tg{width:44px;height:26px;border-radius:9999px;background:var(--hairline-strong);position:relative;transition:background .25s;flex:none;display:inline-block}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s var(--ease);box-shadow:0 1px 3px #0005}
[aria-checked=true]>.tg,.tg[aria-checked=true]{background:var(--accent)}
[aria-checked=true]>.tg::after,.tg[aria-checked=true]::after{transform:translateX(18px)}
.uprow{display:flex;gap:12px;align-items:center;padding:12px 0;border:0;border-top:1px solid var(--hairline);background:none;text-align:left;cursor:pointer;width:100%;color:inherit}
.uprow h5{margin:0;font:600 15px/21px var(--font-serif);flex:1}
.uprow .n{font:700 14px/1 var(--font-serif);color:var(--accent);width:16px}

/* Caught up */
.caught{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:calc(var(--safe-top) + 76px) 20px 48px}
.ring{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:flex;align-items:center;justify-content:center}
.ring .i{width:24px;height:24px}
.caught p{margin:0;font:400 14px/20px var(--font-sans);color:var(--ink-secondary);max-width:290px}
.rule{width:40px;height:1px;background:var(--hairline-strong);margin:6px 0}
.three{align-self:stretch;text-align:left;margin-top:8px}
.three .label{display:block;text-align:center;margin-bottom:6px}
.three button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--hairline);padding:12px 0;font:600 16px/22px var(--font-serif);color:var(--ink);cursor:pointer}
.nextbrief{display:flex;align-items:center;gap:8px;font:500 13px/18px var(--font-sans);color:var(--ink-secondary);margin-top:6px}
.notif{background:var(--surface);border-radius:var(--radius-lg);padding:16px;align-self:stretch;text-align:left;display:flex;flex-direction:column;gap:12px;margin-top:6px;animation:rise .5s var(--ease) both}
.notif b{font:600 15px/20px var(--font-sans)}
.notif p{max-width:none;font-size:13.5px}
.times{display:flex;flex-wrap:wrap;gap:8px}
.times .chip{min-height:40px;padding:0 14px}

/* For you / profile */
.pagehead{margin:0 0 14px;font:700 30px/36px var(--font-serif);letter-spacing:-.02em}
.pagetop{display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.rows{background:var(--surface);border-radius:var(--radius-lg);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;border:0;border-bottom:1px solid var(--hairline);background:none;width:100%;text-align:left;color:var(--ink);cursor:pointer;font:500 14.5px/20px var(--font-sans)}
.row:last-child{border-bottom:0}
.row:active{background:var(--surface-pressed)}
.row .ic{color:var(--ink-secondary)}
.row .val{margin-left:auto;font:400 13.5px/18px var(--font-sans);color:var(--ink-secondary);text-align:right;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .chev{color:var(--ink-muted);width:16px;height:16px}
.row.static{cursor:default}.row.static:active{background:none}
.group{margin-bottom:22px}
.group>.label{margin:0 0 8px 4px;display:block}
.acct{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--radius-lg);padding:16px;margin-bottom:22px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font:700 20px/1 var(--font-serif);flex:none}
.acct b{display:block;font:600 16px/22px var(--font-sans)}
.acct span{font:400 13px/18px var(--font-sans);color:var(--ink-secondary)}
.freeline{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--ink-secondary);font:500 13px/18px var(--font-sans);margin:6px 0 0}
.freeline .i{color:var(--accent);width:16px;height:16px}
.minirow{display:flex;gap:12px;align-items:flex-start;cursor:pointer;background:var(--surface);border-radius:var(--radius-lg);padding:14px 16px;border:0;width:100%;text-align:left;color:var(--ink);box-shadow:var(--shadow-card)}
.minirow:active{background:var(--surface-pressed)}
.minirow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.minirow h4{margin:0;font:600 16px/22px var(--font-serif);letter-spacing:-.005em}
.minirow .iconbtn{margin:-8px -10px 0 0;width:40px;height:40px}
.collchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;margin:0 -16px;padding:0 16px}
.collchips::-webkit-scrollbar{display:none}
.collchips .chip{min-height:36px;padding:0 14px;flex:none;font-size:12.5px}
.field{width:100%;height:50px;border-radius:var(--radius-md);border:0;background:var(--surface-elevated);color:var(--ink);font:400 16px/1 var(--font-sans);padding:0 14px;outline:none;box-shadow:inset 0 0 0 1px transparent;transition:box-shadow .2s}
.field:focus{box-shadow:inset 0 0 0 1.5px var(--accent)}
.codebox{display:flex;gap:10px;justify-content:center}
.codebox i{width:52px;height:60px;border-radius:var(--radius-md);background:var(--surface-elevated);display:flex;align-items:center;justify-content:center;font:600 24px/1 var(--font-sans);font-style:normal;box-shadow:inset 0 0 0 1px transparent;transition:box-shadow .2s}
.codebox i.cur{box-shadow:inset 0 0 0 1.5px var(--accent)}
.opt-row{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:0 16px;border-radius:var(--radius-lg);border:0;background:var(--surface-elevated);color:var(--ink);font:500 14.5px/20px var(--font-sans);text-align:left;cursor:pointer;box-shadow:inset 0 0 0 1.5px transparent}
.opt-row[aria-pressed=true]{box-shadow:inset 0 0 0 1.5px var(--accent)}
.opt-row .ck{margin-left:auto;width:24px;height:24px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;color:transparent;flex:none;box-shadow:inset 0 0 0 1px var(--hairline-strong)}
.opt-row[aria-pressed=true] .ck{background:var(--accent);color:var(--on-accent);box-shadow:none}
.opt-row .ck .i{width:14px;height:14px;stroke-width:2.2}
.list{display:flex;flex-direction:column;gap:8px}
.alert{position:absolute;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:0 40px}
.alert__box{width:100%;border-radius:26px;overflow:hidden;animation:pop .3s cubic-bezier(.3,1.4,.5,1) both;text-align:center;color:var(--ink)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.alert__box h5{margin:0;padding:22px 20px 4px;font:600 17px/22px var(--font-serif)}
.alert__box p{margin:0;padding:0 20px 20px;font:400 13.5px/19px var(--font-sans);color:var(--ink-secondary)}
.alert__box .bt{display:flex;border-top:1px solid var(--hairline)}
.alert__box .bt button{flex:1;height:50px;border:0;background:none;font:600 15px/1 var(--font-sans);color:var(--accent);cursor:pointer}
.alert__box .bt button+button{border-left:1px solid var(--hairline)}
.alert__box .bt button.red{color:#FF6A45}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ---------- v2: tiles, others, more-in-theme, opinion ---------- */
.tiles{display:flex;flex-direction:column;gap:10px;margin-top:16px}

{id:1,t1:0,t2:[0],isNew:1,age:"14 min ago",min:2,listen:84,
 h:"LHV Bank goes live with agentic AI on customer email",
 s:"LHV Bank has deployed AI agents from Gradient Labs across its customer email operations. The agents answer balance questions and make routine account changes inside the bank's audited systems. Complex cases go to human compliance staff with a drafted summary. The rollout followed a trial that began in March.",
 w:"It is an early case of a regulated European bank letting AI agents act on customer accounts, not only draft replies. How supervisors respond will shape what other banks attempt next.",
 e:"The bank gave its email inbox to a team of software helpers. They answer simple questions and make small changes on their own, and pass anything tricky to a person.",
 wim:["Agents now take actions on accounts, not only suggest replies.","Banks under EU operational resilience rules, and their AI vendors.","Supervisor comment on audit trails and limits on unattended changes."],
 src:[["Harbour Business","First report","LHV Bank puts AI agents on customer email","14 min ago"],["Meridian Tech Wire","Confirmation","Estonian lender extends agent trial to live accounts","19 min ago"],["The Ledger Review","Industry context","What EU resilience rules mean for bank AI","26 min ago"],["Circuit Daily","Confirmation","Gradient Labs lands a regulated bank customer","31 min ago"],["Northgate Journal","Analysis","Customer service is where bank agents start","48 min ago"],["Signal & Standard","Confirmation","Bank says human review stays for edge cases","1 hr ago"]],
 hy:["Largely supported","Deployment is confirmed by both the bank and the vendor.","Performance claims come from the bank's own trial. No outside audit is cited.","No supervisor statement yet on whether agents may change account details unattended."],

{id:2,t1:5,t2:[1],isNew:1,age:"42 min ago",min:3,listen:92,
 h:"Data-centre power demand reshapes grid planning in three US regions",
 s:"Grid operators in three US regions have fast-tracked interconnection queues as large data-centre campuses request multi-gigawatt connections. Utilities are revising five-year capital plans upward and regulators are weighing who pays for new transmission. Several operators now ask large users to bring their own generation.",
 w:"Power, not chips, is becoming the limit on where AI capacity gets built. Planning rules written now will decide which regions host the next wave of data centres, and who carries the cost.",
 e:"Computers that run AI are very hungry for electricity. Power companies are rushing to build more wires and plants, and arguing about who should pay.",
 wim:["Large users may be asked to fund or bring their own power.","Utilities, regulators, and companies siting new data centres.","Cost-allocation rulings expected from regional regulators."],
 src:[["Atlas Policy Brief","First report","Three regions rewrite interconnection rules for large loads","42 min ago"],["Meridian Tech Wire","Confirmation","Utilities raise capital plans on data-centre demand","55 min ago"],["Kestrel Energy","Analysis","Who pays for the grid the cloud needs","1 hr ago"],["The Ledger Review","Industry context","Siting decisions follow power, not land","2 hr ago"]],
 hy:["Mostly supported","Queue changes and revised plans appear in regulator filings.","Demand forecasts rely on developer requests, which often overstate what is built.","The split of cost between utilities and data-centre users is not settled."],
 bias:[4,3,1,"Coverage frames the shift as a planning priority for regions.","One analysis warns of stranded assets if forecasts prove high."],
 lens:[["Data-centre exposure now matters in utility credit and project-finance reviews.","Ask lenders how power access is assessed for new campuses."],["Hospital campuses and research sites compete for the same grid capacity.","Review backup power contracts as local demand rises."],["Plants with high load may face new interconnection and tariff rules.","Model on-site generation against the new queue timelines."]]},

{id:3,t1:1,t2:[0],isNew:1,age:"1 hr ago",min:2,listen:70,
 h:"AI-driven phishing slips past standard email filters",
 s:"Security researchers report a rise in phishing messages written and personalised by AI models that pass common filters. The messages mimic internal tone and reference real projects. Vendors are shifting from keyword rules to behaviour checks, while firms retrain staff to verify unusual requests by a second channel.",
 w:"Filters tuned to spot poor writing no longer catch the most targeted attacks. Verification habits and process controls now carry more of the defence than the inbox does.",
 e:"Scammers now use AI to write emails that sound just like your colleagues. The old tricks for spotting fakes, like bad spelling, no longer work.",
 wim:["Targeted messages are cheaper to produce and harder to spot.","Finance teams, executives' assistants, and security staff.","Whether vendors can show detection rates on AI-written mail."],
 src:[["Kestrel Security","First report","Researchers detail AI-written phishing that passes filters","1 hr ago"],["Circuit Daily","Confirmation","Mail vendors move to behaviour-based checks","1 hr ago"],["Northgate Journal","Analysis","Why the second channel is the new control","2 hr ago"],["Harbour Business","Industry context","Finance teams revisit payment approvals","3 hr ago"],["Signal & Standard","Confirmation","Staff training shifts from spotting typos to verifying asks","3 hr ago"]],
 hy:["Partly supported","Several researchers report the same pattern in separate samples.","Detection rates are vendor-reported and use different test sets.","No independent benchmark compares filters on AI-written mail."],
 bias:[3,5,2,"Coverage focuses on a clear and growing threat.","Two pieces say the risk is overstated by vendors selling fixes."],
 lens:[["Require call-back verification for payment changes, whatever the sender looks like.","Test staff with realistic internal-style messages."],["Clinical and billing staff are common targets. Add a second check on payer and vendor changes.","Review mailbox rules for forwarding."],["Supplier bank-detail changes are a known fraud route.","Lock approval of new vendor details to two people."]]},

{id:4,t1:0,t2:[1],age:"2 hr ago",min:3,listen:78,
 h:"Draft AI rules put new disclosure duties on providers",

 src:[["Atlas Policy Brief","First report","Draft rules set disclosure duties for AI providers","2 hr ago"],["The Ledger Review","Analysis","Deployers inherit the paperwork","2 hr ago"],["Meridian Tech Wire","Confirmation","Industry groups ask for longer lead times","3 hr ago"],["Signal & Standard","Industry context","What the draft changes for enterprise buyers","4 hr ago"]],
 hy:["Largely supported","The draft text is public and matches the reported duties.","Timelines and thresholds are described differently across outlets.","The effect on open-source models is not yet addressed."],

let toastT;

let sheetEl=null,sheetOnClose=null;
function openSheet(o){
  closeSheet(true);

  ov.innerHTML=`<div class="scrim" data-a="closesheet"></div><div class="sheet glass ${o.tall?'tall':''}" role="dialog" aria-label="${esc(o.title)}"><div class="handle"></div><div class="sheet__head"><div>${o.eyebrow?`<span class="label">${o.eyebrow}</span>`:''}<h4>${o.title}</h4></div><button class="close" data-a="closesheet" aria-label="Close">${ic('x','sm')}</button></div><div class="sheet__body">${o.body}</div>${o.foot?`<div class="sheetfoot">${o.foot}</div>`:''}</div>`;
  sheetEl=$('.sheet',ov);sheetOnClose=o.onClose||null;dragSheet(sheetEl);o.init&&o.init(sheetEl);
}
function closeSheet(instant){
  if(!sheetEl)return;const ov=$('#overlay'),sh=sheetEl,sc=$('.scrim',ov),cb=sheetOnClose;sheetEl=null;sheetOnClose=null;
  if(instant){ov.innerHTML=''}else{sh.classList.add('out');sc&&sc.classList.add('out');setTimeout(()=>{if(!sheetEl)ov.innerHTML=''},300)}
  $$('.tool').forEach(b=>b.setAttribute('aria-pressed','false'));
  cb&&cb();
}
function dragSheet(sh){
  const zone=[$('.handle',sh),$('.sheet__head',sh)];let y0=null,dy=0;
  const pt=e=>e.touches?e.touches[0].clientY:e.clientY;
  const start=e=>{if(e.target.closest('.close'))return;y0=pt(e);dy=0;sh.style.animation='none'};
  const move=e=>{if(y0==null)return;dy=Math.max(0,pt(e)-y0);sh.style.transform=`translateY(${dy}px)`;sh.style.transition='none'};
  const end=()=>{if(y0==null)return;y0=null;sh.style.transition='transform .3s var(--ease)';if(dy>90){closeSheet()}else{sh.style.transform=''}};
  zone.forEach(z=>{z.style.cursor='grab';z.addEventListener('touchstart',start,{passive:true});z.addEventListener('mousedown',start)});
  sh.addEventListener('touchmove',move,{passive:true});window.addEventListener('mousemove',move);
  sh.addEventListener('touchend',end);window.addEventListener('mouseup',end);
}

/* ---------- Stack navigation and gestures ---------- */
const prevOf=l=>l.previousElementSibling||$('#base');
function push(layer){
  const st=$('#stack'),prev=st.lastElementChild||$('#base');
  prev.classList.add('under');
  st.appendChild(layer);layer.classList.add('push','in');
  layer.addEventListener('animationend',()=>layer.classList.remove('in'),{once:true});
  syncChrome();
}
function pop(){
  const st=$('#stack'),layer=st.lastElementChild;if(!layer||layer._popping)return;
  layer._popping=true;closeSheet(true);
  const prev=prevOf(layer);
  layer.classList.remove('in');layer.style.animation='none';layer.style.transition='transform .32s var(--ease)';layer.style.transform='translateX(100%)';
  prev.style.transition='transform .32s var(--ease),filter .32s';prev.style.transform='translateX(0)';prev.style.filter='none';
  setTimeout(()=>{
    layer._ac&&layer._ac.abort();layer.remove();
    prev.classList.remove('under');prev.style.transform='';prev.style.filter='';prev.style.transition='';
    syncChrome();if(!st.children.length)refreshTabs();
  },330);
}
function popAll(){const st=$('#stack');while(st.children.length>1){const l=st.firstElementChild;l._ac&&l._ac.abort();l.remove()}pop()}
function attachGestures(layer,opts={}){
  const sc=$('.scroll',layer),ac=layer._ac=new AbortController(),sig={signal:ac.signal};let st=null;
  const atBottom=()=>sc.scrollTop+sc.clientHeight>=sc.scrollHeight-4,W=()=>$('#phone').clientWidth;
  const down=(x,y,t)=>{if(layer._popping||t.closest('.tools,.pills,.collchips,.pl-wave'))return;st={x,y,time:Date.now(),dx:0,dy:0,mode:null,bottom:atBottom()}};
  const move=(x,y)=>{if(!st)return;st.dx=x-st.x;st.dy=y-st.y;
    if(!st.mode){if(st.dx>12&&st.dx>Math.abs(st.dy)*1.5){st.mode='h';layer.classList.remove('in');layer.style.animation='none';layer.style.transition='none'}else if(Math.abs(st.dy)>12&&Math.abs(st.dy)>Math.abs(st.dx))st.mode='v'}
    if(st.mode==='h'){const dx=Math.max(0,st.dx),p=Math.min(1,dx/W()),pv=prevOf(layer);layer.style.transform=`translateX(${dx}px)`;pv.style.transition='none';pv.style.transform=`translateX(${-22*(1-p)}%)`;pv.style.filter=`brightness(${.7+.3*p})`}};
  const up=()=>{if(!st)return;const s=st;st=null;
    if(s.mode==='h'){const v=s.dx/Math.max(1,Date.now()-s.time);
      if(s.dx>W()*.33||v>.6)pop();
      else{const pv=prevOf(layer);layer.style.transition='transform .3s var(--ease)';layer.style.transform='translateX(0)';pv.style.transition='transform .3s var(--ease),filter .3s';pv.style.transform='';pv.style.filter=''}}
    else if(s.mode==='v'&&opts.next&&s.bottom&&atBottom()&&s.dy<-70&&Math.abs(s.dx)<70)opts.next()};
  layer.addEventListener('touchstart',e=>down(e.touches[0].clientX,e.touches[0].clientY,e.target),{passive:true,...sig});
  layer.addEventListener('touchmove',e=>move(e.touches[0].clientX,e.touches[0].clientY),{passive:true,...sig});
  layer.addEventListener('touchend',up,sig);layer.addEventListener('touchcancel',up,sig);
  layer.addEventListener('mousedown',e=>{if(e.button===0)down(e.clientX,e.clientY,e.target)},sig);
  window.addEventListener('mousemove',e=>move(e.clientX,e.clientY),sig);window.addEventListener('mouseup',up,sig);
  let acc=0,wt;
  if(opts.next)sc.addEventListener('wheel',e=>{if(atBottom()&&e.deltaY>0){acc+=e.deltaY;clearTimeout(wt);wt=setTimeout(()=>acc=0,400);if(acc>240){acc=0;opts.next()}}else acc=0},{passive:true,...sig});
}
function newLayer(kind){const L=document.createElement('div');L.className='layer';L.dataset.k=kind;return L}

/* ---------- Audio (simulated playback) ---------- */
function audioStart(id,list,play=true){
  A.active=true;A.id=id;A.pos=0;A.list=list.slice();A.playing=play;runTimer();audioChanged();
}
function runTimer(){clearInterval(A.timer);if(A.playing)A.timer=setInterval(tick,250)}
function tick(){const s=byId[A.id];A.pos+=.25*A.speed;if(A.pos>=s.listen)finishStory();else paintAudio()}
function finishStory(){
  S.read.add(A.id);const i=A.list.indexOf(A.id);
  if(A.auto&&i<A.list.length-1){A.id=A.list[i+1];A.pos=0}
  else{A.pos=byId[A.id].listen;A.playing=false;clearInterval(A.timer);toast(i>=A.list.length-1?'End of the brief':'Finished')}
  renderToday();audioChanged();
}
function audioChanged(){syncChrome();refreshStoryBars();if(sheetEl&&$('#pl-wave'))renderPlayer();paintAudio()}
function paintAudio(){
  if(!A.active)return;const s=byId[A.id],r=A.pos/s.listen;
  const bar=$('.player__bar');if(bar)bar.style.width=r*100+'%';
  const w=$('#pl-wave');if(w){const bars=$$('i',w),on=Math.round(r*bars.length);bars.forEach((b,i)=>b.classList.toggle('on',i<on));$('#pl-a').textContent=fmt(A.pos);$('#pl-b').textContent='-'+fmt(s.listen-A.pos)}
}
function playerBody(){
  const s=byId[A.id],i=A.list.indexOf(A.id),up=A.list.slice(i+1,i+4);
  const bars=Array.from({length:44},(_,k)=>`<i style="height:${16+Math.round((Math.sin(k*.62+s.id)*.5+.5)*58+(Math.sin(k*1.7+s.id*2)*.5+.5)*26)}%"></i>`).join('');
  return `<div style="display:flex;flex-direction:column;gap:8px"><span class="label">${i+1} of ${A.list.length} · AI voice</span><span class="label" style="color:var(--accent)">${esc(tagLine(s))}</span><h3 style="font:700 22px/28px var(--font-serif);letter-spacing:-.015em;margin:0">${esc(s.h)}</h3></div>
  <div><div class="pl-wave" id="pl-wave" data-a="seek" role="slider" aria-label="Seek">${bars}</div><div class="pl-time" style="margin-top:8px"><span id="pl-a">0:00</span><span id="pl-b"></span></div></div>
  <div class="pl-ctrl"><button class="speed" data-a="speed" aria-label="Playback speed">${A.speed}×</button><button class="iconbtn" data-a="aprev" style="color:var(--ink)" aria-label="Previous">${ic('prev','lg')}</button><button class="bigplay" data-a="playpause" aria-label="${A.playing?'Pause':'Play'}">${ic(A.playing?'pause':'play')}</button><button class="iconbtn" data-a="anext" style="color:var(--ink)" aria-label="Next">${ic('next','lg')}</button><button class="iconbtn" data-a="stopaudio" aria-label="Stop and close">${ic('stop')}</button></div>
  <button class="switch" role="switch" aria-checked="${A.auto}" data-a="autoadv"><span class="tg"></span>Auto-advance to the next story</button>
  ${up.length?`<div><span class="label">Up next</span><div style="margin-top:6px">${up.map((id,k)=>`<button class="uprow" data-a="aplay" data-id="${id}"><span class="n num">${i+k+2}</span><h5>${esc(byId[id].h)}</h5><span class="meta num">${fmt(byId[id].listen)}</span></button>`).join('')}</div></div>`:''}
  <p class="note">AI-generated voice reading the AI summary. Sample audio is simulated in this prototype.</p>`;
}

async function jump(name){
  resetUI();clearTabs();S=fresh();$('#auth').hidden=true;
  if(name==='welcome'){return viewWelcome()}
  if(name==='themes'){S.method='LinkedIn';return viewThemes()}
  if(name==='others'){S.method='LinkedIn';S.themes=[0,1];viewThemes();await wait(900);const o=$('#oth');o.scrollIntoView({block:'center'});return}
  S.method='LinkedIn';S.themes=[0,1,2];S.where=[0,1];S.others=['Banking x Agentic AI'];
  if(name==='more')S.filter=0;
  if(name==='foryou-saved'){S.saved=[2,6,3];S.colls[0].ids=[2,6];S.colls[1].ids=[3];S.read=new Set([1])}
  if(name==='caught'){S.read=new Set(briefIds())}
  const tab=name==='opinion'||name==='opinion-read'||name==='comments'?'opinion':name==='foryou-empty'||name==='foryou-saved'||name==='picks'?'foryou':name==='profile'?'profile':'today';
  if(name==='picks')S.fySeg='picks';
  enterMain(tab);
  const ids=briefIds();
  const story=async()=>{await wait(80);openStory(ids[0],'brief',ids);await wait(480)};
  if(['story','wim','eli5','hype','bias','lens','reader','share'].includes(name)){await story();
    if(['wim','eli5','hype','bias','lens'].includes(name))toolSheet(name);
    if(name==='reader')openReader(0);
    if(name==='share')shareSheet(ids[0]);}
  if(name==='opinion-read'||name==='comments'){await wait(80);openStory(101,'opinion',opList().map(o=>o.id));await wait(480);if(name==='comments')commentsSheet(101)}
  if(name==='audio'){await wait(80);audioStart(ids[0],ids);A.pos=22;openPlayer()}
  if(name==='caught'){await wait(80);openCaught()}
}

  $$('[data-j]').forEach(b=>b.onclick=()=>jump(b.dataset.j));
  $$('[data-cs]').forEach(b=>b.onclick=()=>{cardStyle=b.dataset.cs;syncSide();if(S.phase==='main')renderToday()});
  $$('[data-ap]').forEach(b=>b.onclick=()=>{appearance=b.dataset.ap;applyTheme();if(S.phase==='main'&&S.tab==='profile')renderProfile()});
  $('#reset').onclick=resetAll;
}
function syncSide(){$$('#o-card button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.cs===cardStyle));$$('#o-app button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.ap===appearance))}

/* ---------- Actions ---------- */
const ACT={
  signin:(t)=>doSignin(t.dataset.m,t),email:()=>openEmail(),
  tile:t=>{const i=+t.dataset.i;if(S.themes.includes(i))S.themes=S.themes.filter(x=>x!==i);else if(S.themes.length>=5){const c=$('#th-count');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');return toast('Pick up to five themes')}else S.themes.push(i);updThemes()},
  addother:t=>{const v=t.dataset.v.trim();if(!v)return;const known=OTHERS_SUGGEST.some(x=>x.toLowerCase()===v.toLowerCase());if(!S.others.some(x=>x.toLowerCase()===v.toLowerCase()))S.others.push(v);const q=$('#oth-q');if(q){q.value='';}othersPaint('');if(!known)toast('Noted. Requests help us decide what to cover next.');q&&q.focus({preventScroll:true})},
  remother:t=>{S.others=S.others.filter(x=>x!==t.dataset.v);const q=$('#oth-q');othersPaint(q?q.value:'')},
  t2:t=>{const i=+t.dataset.i;S.where=S.where.includes(i)?S.where.filter(x=>x!==i):[...S.where,i];updThemes()},
  skipthemes:()=>{S.themes=[];S.where=[];viewPrep()},themesdone:()=>viewPrep(),
  tab:t=>{if($('#stack').children.length){popAll();setTimeout(()=>setTab(t.dataset.k),340)}else if(S.tab===t.dataset.k){const sc=$('#tab-'+t.dataset.k+' .scroll');sc&&sc.scrollTo({top:0,behavior:'smooth'})}else setTab(t.dataset.k)},
  filter:t=>{S.filter=t.dataset.k==='all'?'all':+t.dataset.k;renderToday();const p=$('#tab-today .pill[aria-pressed=true]');p&&p.scrollIntoView({inline:'center',block:'nearest'})},
  open:t=>{const ids=briefIds();openStory(+t.dataset.id,'brief',ids)},
  openctx:t=>{const k=t.dataset.ctx,id=+t.dataset.id;let ids;
    if(k==='saved'){const c=S.fyColl==='all'?null:S.colls.find(c=>c.id===S.fyColl);ids=c?S.saved.filter(x=>c.ids.includes(x)):S.saved.slice();const op=!!byId[id].op;ids=ids.filter(x=>!!byId[x].op===op)}else ids=picksIds();
    openStory(id,byId[id].op?'opinion':k,ids)},
  openmore:t=>{const id=+t.dataset.id;openStory(id,'topic',moreIds(byId[id].t1))},
  openop:t=>{const id=+t.dataset.id;openStory(id,'opinion',opList().map(o=>o.id))},
  opfilter:t=>{S.opFilter=t.dataset.k==='all'?'all':+t.dataset.k;renderOpinion()},
  comments:t=>commentsSheet(+t.dataset.id),
  postcomment:t=>{const id=+t.dataset.id,inp=$('#cm-in'),v=inp&&inp.value.trim();if(!v)return inp&&inp.focus();(OPC[id]=OPC[id]||[]).push({au:'You',role:S.role||'FomoTech member',txt:v,when:'Just now'});commentsDraw(id,sheetEl)},
  writeop:()=>writeSheet(),
  submitop:()=>{closeSheet();toast('Submitted for editorial review. You will hear back by email.')},
  playconv:()=>toast('Video and audio playback is simulated in this prototype'),
  pickwt:t=>{$$('#overlay .chip').forEach(c=>c.setAttribute('aria-pressed',c===t))},
  save:t=>toggleSave(+t.dataset.id),
  back:()=>pop(),next:()=>nextStory(),
  tool:t=>toolSheet(t.dataset.k),
  source:t=>openReader(+t.dataset.k),
  share:t=>shareSheet(+t.dataset.id),
  invite:()=>shareSheet(1,true),
  copylink:t=>{try{navigator.clipboard.writeText('https://'+t.dataset.u)}catch(e){}toast('Link copied')},
  shareto:t=>{closeSheet();toast('Shared to '+t.dataset.n+' (prototype)')},
  closesheet:()=>closeSheet(),
  caught:()=>openCaught(),home:()=>{popAll();setTimeout(()=>setTab('today'),340)},tosaved:()=>{popAll();setTimeout(()=>setTab('foryou'),340)},
  jumpstory:t=>{const ids=briefIds();popAll();setTimeout(()=>{if(S.tab!=='today')setTab('today');openStory(+t.dataset.id,'brief',ids)},360)},
  settime:t=>{S.briefTime=t.dataset.t;$$('#notif .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.t===S.briefTime));const nb=$('#nb span');if(nb)nb.textContent=nextBriefLine()},
  notifon:()=>alertBox('“FomoTech” Would Like to Send You Notifications',`Your daily brief will arrive at ${S.briefTime}.`,[{t:'Don’t Allow',fn:()=>{S.notifAsked=true;const sl=$('#notif-slot');sl&&(sl.innerHTML='');toast('You can turn this on in Profile')}},{t:'Allow',fn:()=>{S.notifAsked=true;S.notif=true;const sl=$('#notif-slot');sl&&(sl.innerHTML=`<div class="notif"><b>Daily brief is on.</b><p>${nextBriefLine()}.</p></div>`)}}]),
  notifno:()=>{S.notifAsked=true;const sl=$('#notif-slot');sl&&(sl.innerHTML='')},
  fyseg:t=>{S.fySeg=t.dataset.k;renderForYou()},
  coll:t=>{S.fyColl=t.dataset.k==='all'?'all':+t.dataset.k;renderForYou()},
  newcoll:()=>newCollSheet(),
  organise:t=>organiseSheet(+t.dataset.id),
  tcoll:t=>{const id=+t.dataset.id,c=S.colls.find(c=>c.id===+t.dataset.c);if(c.ids.includes(id))c.ids=c.ids.filter(x=>x!==id);else{c.ids.push(id);if(!isSaved(id)){S.saved.unshift(id);$$(`[data-a="save"][data-id="${id}"]`).forEach(b=>b.setAttribute('aria-pressed','true'))}}organiseSheet.draw(sheetEl)},
  addcoll:t=>{const inp=$('#nc-in'),name=inp&&inp.value.trim();if(!name)return inp&&inp.focus();const c={id:S.nextColl++,name,ids:[]};S.colls.push(c);
    if(t.dataset.id){const id=+t.dataset.id;c.ids.push(id);if(!isSaved(id)){S.saved.unshift(id);$$(`[data-a="save"][data-id="${id}"]`).forEach(b=>b.setAttribute('aria-pressed','true'))}organiseSheet.draw(sheetEl)}
    else{S.fyColl=c.id;closeSheet();renderForYou()}},
  edit:t=>editSheet(t.dataset.k),
  pickt1:t=>{const i=+t.dataset.i;if(S.themes.includes(i))S.themes=S.themes.filter(x=>x!==i);else if(S.themes.length>=5)return toast('Pick up to five themes');else S.themes.push(i);t.setAttribute('aria-pressed',S.themes.includes(i));$('#t1n').textContent=S.themes.length+' of 5 selected. Your brief leads with these.';renderProfile()},
  pickt2:t=>{const i=+t.dataset.i;S.where=S.where.includes(i)?S.where.filter(x=>x!==i):[...S.where,i];t.setAttribute('aria-pressed',S.where.includes(i));renderProfile()},
  pickTime:t=>{S.briefTime=t.dataset.t;$$('#overlay .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.t===S.briefTime));renderProfile();setTimeout(()=>closeSheet(),220)},
  pickopt:t=>{S[t.dataset.f]=t.dataset.v==='Not set'?null:t.dataset.v;$$('#overlay .opt-row').forEach(c=>c.setAttribute('aria-pressed',c===t));renderProfile();setTimeout(()=>closeSheet(),220)},
  savelinkedin:()=>{S.linkedin=$('#li-in').value.trim();closeSheet();renderProfile()},
  clearlinkedin:()=>{S.linkedin='';closeSheet();renderProfile()},
  togglenotif:()=>{S.notif=!S.notif;S.notifAsked=true;renderProfile();toast(S.notif?`Daily brief on for ${S.briefTime}`:'Daily notification off')},
  appear:t=>{appearance=t.dataset.k;applyTheme();renderProfile()},
  signout:()=>alertBox('Sign out?','You can sign back in any time.',[{t:'Cancel'},{t:'Sign out',fn:resetAll}]),
  delete:()=>alertBox('Delete account?','This removes your themes, saved stories and collections. This can’t be undone.',[{t:'Cancel'},{t:'Delete',cls:'red',fn:()=>{resetAll();setTimeout(()=>toast('Account deleted'),400)}}]),
  /* audio */
  listenbrief:()=>{if(A.active)return openPlayer();const ids=briefIds();audioStart(ids[0],ids);openPlayer()},
  listenstory:()=>{const id=curId();if(A.active&&A.id===id){A.playing=!A.playing;runTimer();audioChanged()}else audioStart(id,S.ctx.ids)},
  openplayer:()=>openPlayer(),
  playpause:()=>{if(A.pos>=byId[A.id].listen-.3){A.pos=0}A.playing=!A.playing;runTimer();audioChanged()},
  stopaudio:()=>{clearInterval(A.timer);A.active=false;A.playing=false;closeSheet();syncChrome();refreshStoryBars();renderToday()},
  speed:()=>{A.speed=SPEEDS[(SPEEDS.indexOf(A.speed)+1)%SPEEDS.length];renderPlayer()},
  autoadv:()=>{A.auto=!A.auto;renderPlayer()},
  aprev:()=>{const i=A.list.indexOf(A.id);if(A.pos>3||i===0)A.pos=0;else{A.id=A.list[i-1];A.pos=0}audioChanged()},
  anext:()=>{const i=A.list.indexOf(A.id);if(i<A.list.length-1){S.read.add(A.id);A.id=A.list[i+1];A.pos=0;renderToday();audioChanged()}else toast('End of the brief')},
  aplay:t=>{A.id=+t.dataset.id;A.pos=0;A.playing=true;runTimer();audioChanged()},
  seek:(t,e)=>seek(e)
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||!$('#phone').contains(t))return;const f=ACT[t.dataset.a];if(f){e.stopPropagation();f(t,e)}});
document.addEventListener('input',e=>{if(e.target.id==='oth-q')othersPaint(e.target.value)});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='oth-q'){e.preventDefault();const b=$('#oth-list [data-a=addother]');b&&b.click();return}
  if(e.key==='Enter'&&e.target.id==='cm-in'){e.preventDefault();const b=$('[data-a=postcomment]');b&&b.click();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-a]')){e.preventDefault();e.target.click()}
  if(e.key==='Escape'){if(sheetEl)closeSheet();else if($('#stack').children.length)pop()}
});

/* ---------- Fit and boot ---------- */
const mobileMQ=matchMedia('(max-width:520px),(pointer:coarse) and (max-width:900px)');
function fit(){
  const w=$('#stagewrap'),d=$('#device');
  if(mobileMQ.matches){w.style.width=w.style.height='';d.style.transform='';return}
  const sc=Math.min(1,(innerHeight-56)/844);d.style.transform=`scale(${sc})`;w.style.width=390*sc+'px';w.style.height=844*sc+'px';
}
addEventListener('resize',fit);
applyTheme();buildSide();syncSide();fit();viewWelcome();
window.__fomo={jump,get S(){return S},A};
})();

</script>
